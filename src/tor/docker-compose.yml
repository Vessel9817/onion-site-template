# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json

name: website
services:
  tor:
    extends:
      file: ../docker-compose.yml
      service: tor
    environment:
      - DISABLE_VANGUARDS=1
    volumes:
      - type: bind
        source: ./keygen.torrc
        target: /etc/tor/torrc
      # Path defined by torrc
      - type: bind
        source: ./secrets/
        target: /var/lib/tor/website/
networks:
  # Matches top-level network configuration
  tor:
    internal: true
    ipam:
      config:
        - subnet: 10.5.3.0/24
          gateway: 10.5.3.1
