server {
    server_name localhost;

    # HTTP
    listen 80;

    #charset koi8-r;

    set_by_lua_block $onion_location {
        local utils = require('.index')

        return utils.get_onion_location()
    }

    resolver 127.0.0.1 valid=30s;

    # SECURITY: Should NEVER contain untrusted input
    # https://gixy.getpagespeed.com/checks/ssrf/
    # https://gixy.getpagespeed.com/checks/http-splitting/
    set_by_lua_block $safe_proxy_address {
        local utils = require('.index')

        return utils.get_proxy_address()
    }

    # App router
    location / {
        # Only allows specific HTTP methods
        limit_except GET POST HEAD {
            deny all;
        }

        # Validates requests before routing
        access_by_lua_block {
            local utils = require('.index')

            return utils.reject_upstream_bytes()
        }

        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_pass $safe_proxy_address;

        # If variable is nonempty and response is 2XX, adding header
        more_set_headers -s '200 201 202 203 204 205 206 207 208 226' "Onion-Location: $onion_location";
    }

    # Redirecting 4XX/5XX server errors to the static error page
    # https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status
    # 494 is nginx's code for an oversized request header, sent as 400
    # A path, not a named location: nginx enters it as GET (HEAD stays HEAD) and reruns server-level rewrites
    error_page 400 401 402 403 404 405 406 407 408 409 410 411 412 413 414 415 416 417 418 421 422 423 424 425 426 428 429 431 451 494 500 501 502 503 504 505 506 507 508 510 511 /error.html;
    # Errors raised while serving the page get the page too
    recursive_error_pages on;
    location = /error.html {
        internal;
        root /usr/local/openresty/nginx/html;
        try_files /error.html =500; # Returns 500 Internal Server Error if error page is missing
        open_file_cache max=1000 inactive=20s;
        sub_filter '<!--@ERROR_CODE-->' $status;
        sub_filter '<!--@ERROR_MESSAGE-->' $status_text;
        sub_filter_once off; # Perform multiple substitutions
    }

    # Pass PHP scripts to a FastCGI server listening on 127.0.0.1:9000
    #location ~ \.php$ {
    #    root           /usr/local/openresty/nginx/html;
    #    fastcgi_pass   127.0.0.1:9000;
    #    fastcgi_index  index.php;
    #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
    #    include        fastcgi_params;
    #}

    # Deny access to .htaccess files, if Apache's document root concurs with nginx's
    location ~ /\.htaccess$ {
        deny all;
    }
}
