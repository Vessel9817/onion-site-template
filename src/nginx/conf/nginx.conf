# nginx.conf  --  docker-openresty
#
# This file is installed to:
#   `/usr/local/openresty/nginx/conf/nginx.conf`
# and is the file loaded by nginx at startup,
# unless the user specifies otherwise.
#
# It tracks the upstream OpenResty's `nginx.conf`, but removes the `server`
# section and adds this directive:
#     `include /etc/nginx/conf.d/*.conf;`
#
# The `docker-openresty` file `nginx.vh.default.conf` is copied to
# `/etc/nginx/conf.d/default.conf`.  It contains the `server` section
# of the upstream `nginx.conf`.
#
# See https://github.com/openresty/docker-openresty/blob/master/README.md#nginx-config-files
#

user nobody nogroup;
#worker_processes 1;
worker_processes auto;

# Enables the use of JIT for regular expressions to speed up their processing.
pcre_jit on;

#error_log  logs/error.log;
error_log  logs/error.log warn;
#error_log  logs/error.log info;

pid logs/nginx.pid;

events {
    worker_connections 1024;
}

# At least worker_connections * 2
worker_rlimit_nofile 2048;

env PROXY_ADDRESS;

http {
    include mime.types;
    default_type application/octet-stream;

    # Map of HTTP error codes to error messages
    map $status $status_text {
        # Not cached so that subrequests keep their status code without writing custom status text
        # https://github.com/Vessel9817/onion-site-template/pull/379#discussion_r4176051480
        volatile;
        400 'Bad Request';
        401 'Unauthorized';
        402 'Payment Required';
        403 'Forbidden';
        404 'Not Found';
        405 'Method Not Allowed';
        406 'Not Acceptable';
        407 'Proxy Authentication Required';
        408 'Request Timeout';
        409 'Conflict';
        410 'Gone';
        411 'Length Required';
        412 'Precondition Failed';
        413 'Content Too Large';
        414 'URI Too Long';
        415 'Unsupported Media Type';
        416 'Range Not Satisfiable';
        417 'Expectation Failed';
        418 'I\'m a teapot';
        421 'Misdirected Request';
        422 'Unprocessable Content';
        423 'Locked';
        424 'Failed Dependency';
        425 'Too Early';
        426 'Upgrade Required';
        428 'Precondition Required';
        429 'Too Many Requests';
        431 'Request Header Fields Too Large';
        451 'Unavailable For Legal Reasons';
        500 'Internal Server Error';
        501 'Not Implemented';
        502 'Bad Gateway';
        503 'Service Unavailable';
        504 'Gateway Timeout';
        505 'HTTP Version Not Supported';
        506 'Variant Also Negotiates';
        507 'Insufficient Storage';
        508 'Loop Detected';
        510 'Not Extended';
        511 'Network Authentication Required';
        default 'Internal Server Error';
    }

    # Enables or disables the use of underscores in client request header fields.
    # When the use of underscores is disabled, request header fields whose names
    # contain underscores are marked as invalid and become subject to the
    # ignore_invalid_headers directive.
    #
    #underscores_in_headers off;

    # Since we have inbound tor traffic, we should have rate limits in place
    # to not have to care about IP blocking. As well, client info is useless.
    access_log off;

    sendfile on;
    #tcp_nopush on;

    #keepalive_timeout 0;
    keepalive_timeout 65;

    gzip on;

    # express's body parsers refuse over 100 KiB, so nginx refuses first
    client_max_body_size 100k;
    # Node refuses over 1000 headers, and nginx adds Host and X-Forwarded-For
    max_headers 998;

    # See Move default writable paths to a dedicated directory (#119)
    # https://github.com/openresty/docker-openresty/issues/119
    client_body_temp_path /var/run/openresty/nginx-client-body;
    proxy_temp_path       /var/run/openresty/nginx-proxy;
    fastcgi_temp_path     /var/run/openresty/nginx-fastcgi;
    uwsgi_temp_path       /var/run/openresty/nginx-uwsgi;
    scgi_temp_path        /var/run/openresty/nginx-scgi;

    # Privacy settings
    server_tokens off;
    more_clear_headers Server;
    more_clear_headers X-Powered-By;
    more_clear_headers X-Served-By;
    more_clear_headers X-Jsd-*;
    more_clear_headers ETag;
    # nginx gives errors it raises its own reason phrase, such as 405 Not Allowed
    header_filter_by_lua_block {
        -- The map gives codes it doesn't list 500's text
        local status = ngx.status
        if status >= 400 and (status == 500 or ngx.var.status_text ~= 'Internal Server Error') then
            require('ngx.resp').set_status(status, ngx.var.status_text)
        end
    }

    # Setting shared variables
    init_by_lua_block {
        function to_boolean(v)
            local falsy = v == false or v == 0 or v == '' or v == '0' or v == 'false' or v == 'no'

            if falsy then
                return false
            else
                return true
            end
        end

        function get_onion_domain()
            local file, msg = io.open('/run/secrets/hostname', 'r')

            -- Validating file can be read
            if file == nil then
                print(string.format("Couldn't read hostname file: %s", msg))
                return ''
            end

            local hostname = string.lower(file:read())
            io.close(file)

            -- Validating Onion v3 address
            local pattern = '^' .. string.rep("%w", 56) .. '%.onion'

            if string.match(hostname, pattern) == nil then
                print(string.format('Ignoring invalid hostname: %s', hostname))
                return ''
            end

            return string.format('http://%s', hostname)
        end

        function get_onion_location()
            if to_boolean(os.getenv("USE_ONION_LOCATION")) then
                ngx.shared.onion_domain = get_onion_domain()
            else
                ngx.shared.onion_domain = ''
            end
        end

        get_onion_location()
    }

    include /etc/nginx/conf.d/*.conf;
}
