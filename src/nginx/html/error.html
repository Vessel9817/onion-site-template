<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Error</title>
        <meta name="color-scheme" content="light dark" />
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="white" />
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="black" />
        <link rel="icon" href="data:," />
        <meta name="referrer" content="no-referrer" />
        <style>
            :root {
                color-scheme: light dark;
                --light-mode: initial;
                --dark-mode: ;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --light-mode: ;
                    --dark-mode: initial;
                }
            }
            html {
                --bg: var(--light-mode, white) var(--dark-mode, black);
                --fg: var(--light-mode, black) var(--dark-mode, white);
            }
            @supports (color: light-dark(black, white)) {
                html {
                    --bg: light-dark(white, black);
                    --fg: light-dark(black, white);
                }
            }
            body {
                background-color: var(--bg);
                color: var(--fg);
                font-family: system-ui, sans-serif;
                line-height: 1.5;
                margin: 0 auto;
                max-width: 45rem;
                padding: 1rem;
            }
            h1 {
                font-size: 1.6rem;
                line-height: 1.2;
                margin: 0 0 1rem;
            }
        </style>
    </head>
    <body>
        <main>
            <h1><!--@ERROR_CODE--> <!--@ERROR_MESSAGE--></h1>
            <p>If you think this is an error, please contact this site's maintainers.</p>
        </main>
    </body>
</html>
