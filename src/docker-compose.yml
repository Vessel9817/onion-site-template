# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json

# The local driver rotates each container's logs; Docker's default, json-file, doesn't
x-logging: &logging
  driver: local

services:
  tor:
    container_name: tor
    restart: always
    build:
      context: ./tor
      dockerfile: ./Dockerfile
      target: run
    logging: *logging
  nginx:
    container_name: nginx
    restart: always
    build:
      context: ./nginx
      dockerfile: ./Dockerfile
      target: openresty-gixy
    logging: *logging
  express:
    container_name: express
    restart: on-failure
    build:
      context: ./express
      dockerfile: ./Dockerfile
      target: run
    logging: *logging
  mongo-init:
    extends: mongo
    restart: on-failure
    build:
      context: ./mongo
      dockerfile: ./Dockerfile
      target: init
    # Doesn't affect /proc/sys/vm/swappiness
    mem_swappiness: 1
  mongo:
    restart: always
    build:
      context: ./mongo
      dockerfile: ./Dockerfile
      target: run
    # Doesn't affect /proc/sys/vm/swappiness
    mem_swappiness: 1
    # mongod takes 15 s to shut down after SIGTERM
    stop_grace_period: 30s
    configs:
      - source: mongo-replicas
        target: /docker-entrypoint-initdb.d/replicas.json
    secrets:
      - source: mongo-keyfile
        target: /run/secrets/keyFile.pem
        mode: 0400
        uid: '999'
        gid: '999'
      - source: mongo-config
        target: /run/secrets/.env
      - source: mongo-root-username
        target: /run/secrets/root/username.txt
      - source: mongo-root-password
        target: /run/secrets/root/password.txt
      - source: mongo-username
        target: /run/secrets/express/username.txt
      - source: mongo-password
        target: /run/secrets/express/password.txt
    logging: *logging
  onionprobe:
    container_name: onionprobe
    build:
      context: ./onionprobe/onionprobe
      dockerfile: ./containers/onionprobe/Dockerfile
    logging: *logging
  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3-distroless
    restart: always
    logging: *logging
  grafana:
    container_name: grafana
    image: grafana/grafana-oss:13.0.1-security-01
    restart: always
    environment:
      # No anonymous usage statistics
      GF_ANALYTICS_REPORTING_ENABLED: false
      # Mitigate network discovery
      GF_AUTH_ANONYMOUS_HIDE_VERSION: true
      GF_METRICS_ENABLED: false
      # Disable pings to grafana.com
      GF_ANALYTICS_CHECK_FOR_UPDATES: false
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: false
      GF_PLUGINS_PREINSTALL_DISABLED: true
    logging: *logging
  onionscan:
    container_name: onionscan
    restart: on-failure
    build:
      context: ./onionscan
      dockerfile: ./Dockerfile
      target: onionscan
    secrets:
      - source: tor-hostname
        target: /run/secrets/hostname
    logging: *logging
  onionscan-ui:
    container_name: onionscan-ui
    restart: on-failure
    build:
      context: ./onionscan
      dockerfile: ./Dockerfile
      target: onionscan
    command: [
      "--verbose",
      "--mode", "analysis"
    ]
    logging: *logging
  license-report:
    container_name: license-report
    build:
      context: ..
      dockerfile: ./src/license-report/Dockerfile
    # If we have node modules installed, inspect them.
    # If we don't, only inspect package.json
    working_dir: /project/packages/
    logging: *logging
  container-link:
    build:
      context: ./container-link
      dockerfile: ./Dockerfile
    logging: *logging
configs:
  mongo-replicas:
    file: ./mongo/replicas.json
secrets:
  tor-hostname:
    file: ./tor/secrets/hostname
  mongo-config:
    file: ./mongo/secrets/.env
  mongo-keyfile:
    file: ./mongo/secrets/keyFile.pem
  mongo-root-username:
    file: ./mongo/secrets/root/username.txt
  mongo-root-password:
    file: ./mongo/secrets/root/password.txt
  mongo-username:
    file: ./mongo/secrets/express/username.txt
  mongo-password:
    file: ./mongo/secrets/express/password.txt
